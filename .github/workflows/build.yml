name: Build Releases

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    name: Windows Desktop
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install and build
        working-directory: desktop
        run: |
          Copy-Item -Path ../app -Destination app -Recurse -Force
          npm install
          npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: desktop/dist/

  android:
    name: Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Show Java version
        run: java -version
      - name: Generate Android project
        working-directory: android
        run: |
          npm init -y
          npm install @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8 @capacitor/filesystem@8
          npm install ./local-plugins/ailearn-directory-picker
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: android/android
        run: ./gradlew :app:assembleDebug --stacktrace --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: android/android/app/build/outputs/apk/debug/app-debug.apk

  release:
    name: Publish Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: release
      - uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: release
      - name: Extract artifacts
        run: |
          cd release
          find . -name '*.zip' -exec unzip -o {} \;
          find . -type f \( -name '*.exe' -o -name '*.apk' -o -name '*.zip' \) -print
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            release/**/*.exe
            release/**/*.apk
            release/**/*.zip
          generate_release_notes: true
