<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AI闯关学习</title>
<link rel="stylesheet" href="/css/style.css?v=23">
</head>
<body>
<div id="app"></div>

<!-- Templates -->
<template id="tpl-login">
  <div class="page page-center">
    <div class="login-card">
      <div class="logo-area">
        <div class="logo-icon">🧠</div>
        <h1>AI 闯关学习</h1>
        <p>上传资料 · 生成卡片 · 每日闯关</p>
      </div>
      <div class="login-tabs">
        <button type="button" class="tab-btn active" id="tab-pwd">密码登录</button>
        <button type="button" class="tab-btn" id="tab-code">验证码登录</button>
      </div>

      <form id="login-pwd-form" class="login-form">
        <div class="input-group">
          <label>邮箱</label>
          <input type="email" id="login-email" maxlength="254" placeholder="请输入邮箱" autocomplete="email">
        </div>
        <div class="input-group">
          <label>密码</label>
          <input type="password" id="login-password" maxlength="128" placeholder="请输入密码" autocomplete="current-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btn-login">登录</button>
        <div class="login-links">
          <a href="#" id="link-register">注册账号</a>
          <a href="#" id="link-reset">忘记密码</a>
        </div>
      </form>

      <form id="login-code-form" class="login-form hidden">
        <div class="input-group">
          <label>邮箱</label>
          <input type="email" id="login-code-email" maxlength="254" placeholder="请输入邮箱" autocomplete="email">
        </div>
        <div class="input-row">
          <div class="input-group flex-1">
            <label>验证码</label>
            <input type="text" id="login-code-value" maxlength="6" placeholder="6位验证码" autocomplete="one-time-code">
          </div>
          <button type="button" id="btn-send-login-code" class="btn btn-outline btn-code" disabled>发送验证码</button>
        </div>
        <div id="dev-code-hint-login" class="dev-code-hint hidden"></div>
        <button type="submit" class="btn btn-primary btn-block" id="btn-login-code">登录 / 注册</button>
        <div class="login-links"><a href="#" id="link-back-login-code">返回密码登录</a></div>
      </form>

      <form id="register-form" class="login-form hidden">
        <div class="login-mode-title">注册账号</div>
        <div class="input-group">
          <label>邮箱</label>
          <input type="email" id="reg-email" maxlength="254" placeholder="请输入邮箱" autocomplete="email">
        </div>
        <div class="input-row">
          <div class="input-group flex-1">
            <label>邮箱验证码</label>
            <input type="text" id="reg-code" maxlength="6" placeholder="6位验证码" autocomplete="one-time-code">
          </div>
          <button type="button" id="btn-send-reg-code" class="btn btn-outline btn-code" disabled>发送验证码</button>
        </div>
        <div id="dev-code-hint-reg" class="dev-code-hint hidden"></div>
        <div class="input-group">
          <label>设置密码</label>
          <input type="password" id="reg-password" maxlength="128" minlength="6" placeholder="至少6位" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btn-register">注册</button>
        <div class="login-links"><a href="#" id="link-back-login-reg">返回登录</a></div>
      </form>

      <form id="reset-form" class="login-form hidden">
        <div class="login-mode-title">重置密码</div>
        <div class="input-group">
          <label>邮箱</label>
          <input type="email" id="reset-email" maxlength="254" placeholder="请输入注册邮箱" autocomplete="email">
        </div>
        <div class="input-row">
          <div class="input-group flex-1">
            <label>邮箱验证码</label>
            <input type="text" id="reset-code" maxlength="6" placeholder="6位验证码" autocomplete="one-time-code">
          </div>
          <button type="button" id="btn-send-reset-code" class="btn btn-outline btn-code" disabled>发送验证码</button>
        </div>
        <div id="dev-code-hint-reset" class="dev-code-hint hidden"></div>
        <div class="input-group">
          <label>新密码</label>
          <input type="password" id="reset-password" maxlength="128" minlength="6" placeholder="至少6位" autocomplete="new-password">
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="btn-reset">重置密码</button>
        <div class="login-links"><a href="#" id="link-back-login-reset">返回登录</a></div>
      </form>

      <p class="login-hint">注册后可用邮箱和密码登录，也可用验证码快捷登录</p>
    </div>
  </div>
</template>

<template id="tpl-loading">
  <div class="page page-center">
    <div class="spinner"></div>
    <p style="margin-top:16px;color:#94a3b8;">加载中…</p>
  </div>
</template>

<template id="tpl-home">
  <div class="page">
    <header class="topbar">
      <div class="topbar-title">AI 闯关学习</div>
      <div class="topbar-actions">
        <button class="btn-icon" id="btn-settings" title="设置">⚙️</button>
        <button class="btn-icon" id="btn-logout" title="退出">🚪</button>
      </div>
    </header>
    <main class="main-content">
      <div class="section-header">
        <h2>我的学习区</h2>
        <button class="btn btn-primary btn-sm" id="btn-new-zone">+ 新建</button>
      </div>
      <div id="zone-list" class="zone-list"></div>
      <div id="zone-empty" class="empty-state hidden">
        <div class="empty-icon">📚</div>
        <p>还没有学习区</p>
        <p class="empty-hint">点击右上角新建，上传学习资料开始闯关</p>
      </div>
    </main>
  </div>
</template>

<template id="tpl-zone-detail">
  <div class="page">
    <header class="topbar">
      <button class="btn-icon btn-back" id="btn-back-home">←</button>
      <div class="topbar-title zone-title" id="zone-name">学习区</div>
      <div style="width:40px"></div>
    </header>
    <main class="main-content">
      <div class="zone-stats" id="zone-stats"></div>
      <div class="zone-progress" id="zone-progress"></div>
      
      <div class="section-header">
        <h3>文件</h3>
        <button class="btn btn-outline btn-sm" id="btn-upload">📎 上传文件</button>
      </div>
      <div id="file-list" class="file-list"></div>
      
      <div id="analyze-area" class="hidden">
        <div class="section-header">
          <h3>知识卡片</h3>
          <div>
            <button class="btn btn-outline btn-sm" id="btn-ai-trend">AI 趋势分析</button>
          </div>
        </div>
        <div id="kp-area"></div>
      </div>
      
      <div class="section-header">
        <h3>卡片列表</h3>
        <div class="header-actions">
          <button class="btn btn-outline btn-sm" id="btn-cards" style="display:none">知识卡片</button>
          <button class="btn btn-outline btn-sm" id="btn-wrong" style="display:none">错题集</button>
        </div>
      </div>
      <div id="card-list" class="card-list"></div>
      <div id="card-empty" class="empty-state hidden">
        <p>暂无卡片，请先上传文件并生成卡片</p>
      </div>
      
      <div id="learn-result" class="learn-result hidden"></div>
    </main>
  </div>
</template>

<template id="tpl-learn">
  <div class="page">
    <header class="topbar">
      <button class="btn-icon btn-back" id="btn-back-zone">←</button>
      <div class="topbar-title" id="learn-title">今日闯关</div>
      <div style="width:40px"></div>
    </header>
    <main class="main-content">
      <div id="learn-progress" class="learn-progress"></div>
      <div id="card-quiz" class="card-quiz"></div>
      <div id="learn-done" class="learn-done hidden">
        <div class="done-icon">🎉</div>
        <h2 id="done-title">今日任务全部完成！</h2>
        <p id="done-msg"></p>
        <div class="done-actions">
          <button class="btn btn-outline" id="btn-back-home-done">返回路径</button>
          <button class="btn btn-primary hidden" id="btn-next-level">继续下一关</button>
        </div>
      </div>
    </main>
  </div>
</template>

<template id="tpl-upload">
  <div class="page">
    <header class="topbar">
      <button class="btn-icon btn-back" id="btn-back-upload">←</button>
      <div class="topbar-title">上传文件</div>
      <div style="width:40px"></div>
    </header>
    <main class="main-content">
      <div class="settings-section">
        <h3>支持的文件类型</h3>
        <p class="form-hint">txt、md、cpp、h、py、pdf、docx 和图片</p>
        <p class="form-hint">PDF 需要是可复制文本的 PDF，不支持扫描图片</p>
        <input type="file" id="upload-file-input" class="upload-input" accept=".txt,.md,.cpp,.h,.py,.pdf,.docx,.png,.jpg,.jpeg,.gif,.webp,.bmp">
        <div id="upload-file-name" class="upload-file-name"></div>
        <button class="btn btn-primary btn-block" id="btn-upload-confirm" disabled>确认上传</button>
      </div>
    </main>
  </div>
</template>

<template id="tpl-ai">
  <div class="page">
    <header class="topbar">
      <button class="btn-icon btn-back" id="btn-back-ai">←</button>
      <div class="topbar-title">AI 趋势分析</div>
      <div style="width:40px"></div>
    </header>
    <main class="main-content">
      <div class="ai-chat" id="ai-chat">
        <div class="ai-msg ai-msg-bot">我会阅读学习区里的文件，把全部知识点按区块整理出来，每一条知识点生成一张卡片。</div>
        <div class="ai-msg ai-msg-user" id="ai-start-hint">点击下方按钮开始分析</div>
      </div>
      <div id="ai-result" class="ai-result hidden"></div>
      <div class="ai-file-select">
        <div class="ai-import-title">选择要分析的文件</div>
        <div id="ai-file-list" class="ai-select-list"></div>
      </div>
      <div id="ai-import-options" class="ai-import-options hidden">
        <div class="ai-import-title">旧卡片处理</div>
        <div class="ai-import-control">
          <label><input type="radio" name="replace-old" value="none" checked> 保留旧卡片</label>
          <label><input type="radio" name="replace-old" value="all"> 全部删除旧卡片</label>
          <label><input type="radio" name="replace-old" value="selected"> 选择清理旧卡片</label>
        </div>
        <div id="ai-select-cards" class="ai-select-cards hidden">
          <div class="ai-select-head">选择要删除的旧卡片</div>
          <div id="ai-select-list" class="ai-select-list"></div>
        </div>
      </div>
      <div class="ai-actions">
        <button class="btn btn-primary btn-block" id="btn-ai-analyze">开始分析</button>
        <button class="btn btn-outline btn-block hidden" id="btn-ai-regenerate">重新生成</button>
        <button class="btn btn-success btn-block hidden" id="btn-ai-confirm">确认生成卡片</button>
      </div>
    </main>
  </div>
</template>

<template id="tpl-cards">
  <div class="page">
    <header class="topbar">
      <button class="btn-icon btn-back" id="btn-back-cards">←</button>
      <div class="topbar-title">知识卡片</div>
      <div style="width:40px"></div>
    </header>
    <main class="main-content">
      <div class="section-header">
        <h3>全部知识卡片</h3>
        <span class="cards-count" id="cards-count"></span>
      </div>
      <div class="cards-toolbar">
        <label class="cards-select-all"><input type="checkbox" id="cards-select-all"> 全选</label>
        <div class="cards-toolbar-actions">
          <button class="btn btn-outline btn-sm" id="btn-cards-bulk-review" disabled>加入今日复习</button>
          <button class="btn btn-danger btn-sm" id="btn-cards-bulk-delete" disabled>删除选中</button>
        </div>
      </div>
      <div id="cards-list" class="cards-list"></div>
      <div id="cards-empty" class="empty-state hidden">
        <div class="empty-icon">🃏</div>
        <p>还没有知识卡片</p>
        <p class="empty-hint">上传文件后点击“AI 趋势分析”生成卡片</p>
      </div>
    </main>
  </div>
</template>

<template id="tpl-wrong">
  <div class="page">
    <header class="topbar">
      <button class="btn-icon btn-back" id="btn-back-zone-wrong">←</button>
      <div class="topbar-title">错题集</div>
      <div style="width:40px"></div>
    </header>
    <main class="main-content">
      <div class="section-header">
        <h3>错题重练</h3>
        <div class="header-actions">
          <button class="btn btn-outline btn-sm" id="btn-wrong-start">单独复习</button>
          <button class="btn btn-primary btn-sm" id="btn-wrong-practice">+ 加入今日练习</button>
        </div>
      </div>
      <div id="wrong-list" class="wrong-list"></div>
      <div id="wrong-empty" class="empty-state hidden">
        <div class="empty-icon">🎯</div>
        <p>还没有错题</p>
        <p class="empty-hint">答错的卡片会自动收进这里</p>
      </div>
    </main>
  </div>
</template>

<template id="tpl-settings">
  <div class="page">
    <header class="topbar">
      <button class="btn-icon btn-back" id="btn-back-home-set">←</button>
      <div class="topbar-title">设置</div>
      <div style="width:40px"></div>
    </header>
    <main class="main-content">
      <div class="settings-section">
        <h3>个人设置</h3>
        <div class="form-group">
          <label>昵称</label>
          <input type="text" id="set-nickname" maxlength="20" placeholder="给自己起个名字">
        </div>
        <div class="form-group">
          <label>每日学习卡片数</label>
          <input type="number" id="set-daily-limit" min="1" max="100" value="5">
          <span class="form-hint">每天新学的卡片数量，默认5张</span>
        </div>
        <button class="btn btn-primary btn-block" id="btn-save-profile">保存个人设置</button>
      </div>
      
      <div class="section-header">
        <h3>AI 服务商</h3>
        <button class="btn btn-primary btn-sm" id="btn-add-provider">+ 添加</button>
      </div>
      <div id="provider-list" class="provider-list"></div>
      <div id="provider-empty" class="empty-state hidden">
        <div class="empty-icon">🔌</div>
        <p>还没有服务商</p>
        <p class="empty-hint">添加服务商后进入配置页填写 API</p>
      </div>
      <div id="settings-msg" class="toast hidden"></div>
    </main>
  </div>
</template>

<template id="tpl-provider-detail">
  <div class="page">
    <header class="topbar">
      <button class="btn-icon btn-back" id="btn-back-providers">←</button>
      <div class="topbar-title" id="provider-detail-title">服务商配置</div>
      <span class="provider-active-badge" id="provider-active-badge">未启动</span>
    </header>
    <main class="main-content">
      <div class="settings-section">
        <h3>服务商设置</h3>
        <div class="form-group">
          <label>服务商名称</label>
          <input type="text" id="p-name" maxlength="30" placeholder="例如：我的 DeepSeek">
        </div>
        <div class="form-group">
          <label>接口地址</label>
          <input type="url" id="p-base-url" placeholder="https://api.deepseek.com">
          <span class="form-hint">选择服务商模板可自动填入，也可手动修改</span>
        </div>
        <div class="form-group">
          <label>API Key</label>
          <div class="key-row">
            <input type="password" id="p-api-key" placeholder="输入你的 API Key" autocomplete="off">
            <button class="btn btn-outline btn-sm" id="btn-toggle-key">显示</button>
          </div>
          <span class="form-hint" id="p-key-hint"></span>
        </div>
        <div class="form-group">
          <label>服务商模板</label>
          <select id="p-preset"></select>
        </div>
      </div>

      <div class="settings-section">
        <div class="section-header">
          <h3>模型</h3>
          <button class="btn btn-outline btn-sm" id="btn-fetch-models">获取模型</button>
        </div>
        <div id="fetch-result" class="ai-test-result hidden"></div>
        <div class="model-toolbar">
          <input type="number" id="add-model-count" min="1" max="20" value="1">
          <button class="btn btn-outline btn-sm" id="btn-add-model">+ 添加模型</button>
        </div>
        <div id="model-rows" class="model-rows"></div>
        <p id="model-empty" class="form-hint">还没有模型，请先点击“获取模型”，再点“添加模型”选择官方模型。</p>
      </div>

      <div class="settings-section hidden" id="custom-template-section">
        <h3>自定义完整模板</h3>
        <p class="form-hint">支持粘贴 CC Switch / 各类 API 配置软件导出的 JSON，字段：name、base_url、api_key、models</p>
        <textarea id="template-json" rows="7" placeholder='{"name":"我的服务商","base_url":"https://api.example.com/v1","api_key":"sk-...","models":["model-1","model-2"]}'></textarea>
        <div class="template-actions">
          <button class="btn btn-outline btn-sm" id="btn-template-sample">填入示例</button>
          <button class="btn btn-primary btn-sm" id="btn-template-apply">应用模板</button>
        </div>
      </div>

      <button class="btn btn-primary btn-block" id="btn-save-provider">保存配置</button>
      <button class="btn btn-success btn-block" id="btn-activate-provider">启动此服务商</button>
      <button class="btn btn-outline btn-block" id="btn-test-provider">测试连接</button>
      <div id="provider-test-result" class="ai-test-result hidden"></div>
      <button class="btn btn-danger btn-block" id="btn-delete-provider">删除服务商</button>
    </main>
  </div>
</template>

<!-- Toast -->
<div id="toast" class="toast-global hidden"></div>
<!-- Modal -->
<div id="modal" class="modal-overlay hidden">
  <div class="modal-box" id="modal-box"></div>
</div>

<script src="/js/api.js?v=23"></script>
<script src="/js/auth.js?v=23"></script>
<script src="/js/zones.js?v=23"></script>
<script src="/js/cards.js?v=23"></script>
<script src="/js/settings.js?v=23"></script>
<script src="/js/app.js?v=23"></script>
</body>
</html>
