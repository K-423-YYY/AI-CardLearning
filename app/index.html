<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AI闯关学习</title>
<meta name="theme-color" content="#0f172a">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<link rel="icon" href="./icons/icon-192.png">
<link rel="stylesheet" href="./css/variables.css?v=35">
<link rel="stylesheet" href="./css/reset.css?v=35">
<link rel="stylesheet" href="./css/layout.css?v=35">
<link rel="stylesheet" href="./css/components.css?v=35">
<link rel="stylesheet" href="./css/pages.css?v=35">
<link rel="stylesheet" href="./css/mobile.css?v=35">
</head>
<body>
<!-- Desktop Sidebar -->
<nav id="sidebar" class="sidebar" role="navigation" aria-label="主导航">
  <div class="sidebar-header">
    <div class="sidebar-brand-icon">AI</div>
    <div>
      <div class="sidebar-brand-name">AI 闯关学习</div>
      <div class="sidebar-brand-sub">本地开源版</div>
    </div>
  </div>
  <div class="sidebar-nav">
    <button class="sidebar-item active" data-nav="home">
      <span class="sidebar-icon">⌂</span> 学习总览
    </button>
    <button class="sidebar-item" data-nav="zone">
      <span class="sidebar-icon">📚</span> 学习区
    </button>
    <button class="sidebar-item" data-nav="library">
      <span class="sidebar-icon">🃏</span> 卡片库
    </button>
    <button class="sidebar-item" data-nav="ai">
      <span class="sidebar-icon">✦</span> AI 分析
    </button>
    <button class="sidebar-item" data-nav="sync">
      <span class="sidebar-icon">☁</span> 数据同步
    </button>
    <button class="sidebar-item" data-nav="settings">
      <span class="sidebar-icon">⚙</span> 设置
    </button>
  </div>
  <div class="sidebar-footer">
    <div class="sidebar-sync-status">
      <span class="sidebar-sync-dot offline" id="sidebar-sync-dot"></span>
      <span id="sidebar-sync-text">本地模式</span>
    </div>
    <div class="sidebar-user">
      <div class="sidebar-avatar" id="sidebar-avatar">L</div>
      <span class="sidebar-user-name" id="sidebar-user-name">本地用户</span>
    </div>
    <span class="sidebar-version" id="sidebar-version">版本 0.3.0</span>
  </div>
</nav>

<div id="main-wrapper">
  <!-- Desktop Topbar -->
  <header id="desktop-topbar" class="topbar-desktop">
    <div class="breadcrumb" id="desktop-breadcrumb"></div>
    <div class="topbar-actions">
      <span class="badge badge-primary" id="sync-status-badge">● 本地模式</span>
      <button class="btn btn-outline btn-sm" id="desktop-backup">导出备份</button>
      <button class="btn-icon" id="desktop-settings" title="设置" aria-label="设置">⚙</button>
    </div>
  </header>

  <!-- Mobile Topbar -->
  <header id="mobile-topbar" class="topbar-mobile">
    <button class="btn-back" id="btn-mobile-back" aria-label="返回">←</button>
    <h1 id="mobile-title">AI 闯关学习</h1>
    <div class="topbar-actions" id="mobile-topbar-actions"></div>
  </header>

  <div id="app"></div>

  <!-- Mobile Tab Bar -->
  <nav id="tabbar" class="tabbar" role="navigation" aria-label="底部导航">
    <button class="tabbar-item active" data-nav="learn" aria-label="学习">
      <span class="tabbar-icon">⌂</span>
      <span class="tabbar-label">学习</span>
    </button>
    <button class="tabbar-item" data-nav="cards" aria-label="卡片库">
      <span class="tabbar-icon">🃏</span>
      <span class="tabbar-label">卡片库</span>
    </button>
    <button class="tabbar-item" data-nav="sync" aria-label="同步">
      <span class="tabbar-icon">☁</span>
      <span class="tabbar-label">同步</span>
    </button>
    <button class="tabbar-item" data-nav="settings" aria-label="设置">
      <span class="tabbar-icon">⚙</span>
      <span class="tabbar-label">设置</span>
    </button>
  </nav>
</div>

<!-- Floating Action Button -->
<button id="fab" class="fab hidden" title="新建学习区" aria-label="新建学习区">+</button>

<!-- Legacy sidebar (hidden, kept for backward compat during transition) -->

<!-- Templates -->
<template id="tpl-loading">
  <div class="page page-center">
    <div class="spinner"></div>
    <p style="margin-top:16px;color:#94a3b8;">加载中…</p>
  </div>
</template>

<template id="tpl-home">
  <div class="page">
    <header class="topbar">
      <div class="topbar-title">AI 闯关学习</div>
      <div class="topbar-actions">
        <button class="btn-icon" id="btn-settings" title="设置">⚙️</button>
        <button class="btn-icon" id="btn-logout" title="退出">🚪</button>
      </div>
    </header>
    <main class="main-content">
      <div class="desktop-hero hidden" id="desktop-hero"></div>
      <div id="home-calendar" class="calendar-panel hidden"></div>
      <div class="section-header">
        <h2>我的学习区</h2>
        <button class="btn btn-primary btn-sm" id="btn-new-zone">+ 新建</button>
      </div>
      <div id="pinned-zone-section" class="pinned-zone-section hidden">
        <div class="section-header">
          <h3>📌 置顶学习区</h3>
        </div>
        <div id="pinned-zone-list" class="zone-list"></div>
      </div>
      <div id="zone-list" class="zone-list"></div>
      <div id="zone-empty" class="empty-state hidden">
        <div class="empty-icon">📚</div>
        <p>还没有学习区</p>
        <p class="empty-hint">点击右上角新建，上传学习资料开始闯关</p>
      </div>
      <div class="app-version" id="app-version"></div>
    </main>
  </div>
</template>

<template id="tpl-zone-detail">
  <div class="page">
    <header class="topbar">
      <button class="btn-icon btn-back" id="btn-back-home">←</button>
      <div class="topbar-title zone-title" id="zone-name">学习区</div>
      <div style="width:40px"></div>
    </header>
    <main class="main-content">
      <div class="zone-stats" id="zone-stats"></div>
      <div id="zone-calendar" class="calendar-panel hidden"></div>
      <div class="zone-progress" id="zone-progress"></div>
      <div class="study-mode-row" id="study-mode-row">
        <span>关卡学习模式</span>
        <div class="study-mode-control">
          <button class="study-mode-btn" data-mode="quiz">闯关卡</button>
          <button class="study-mode-btn" data-mode="memory">记忆卡</button>
        </div>
      </div>
      
      <div class="section-header">
        <h3>文件</h3>
        <button class="btn btn-outline btn-sm" id="btn-upload">📎 上传文件</button>
      </div>
      <div id="file-list" class="file-list"></div>
      
      <div id="analyze-area" class="hidden">
        <div class="section-header">
          <h3>知识卡片</h3>
          <div>
            <button class="btn btn-outline btn-sm" id="btn-ai-trend">AI 趋势分析</button>
          </div>
        </div>
        <div id="kp-area"></div>
      </div>
      
      <div class="section-header">
        <h3>卡片库</h3>
        <div class="header-actions">
          <button class="btn btn-outline btn-sm" id="btn-wrong" style="display:none">错题集</button>
        </div>
      </div>
      <div id="library-panel" class="library-panel"></div>
      
      <div id="learn-result" class="learn-result hidden"></div>
    </main>
  </div>
</template>

<template id="tpl-learn">
  <div class="page">
    <header class="topbar">
      <button class="btn-icon btn-back" id="btn-back-zone">←</button>
      <div class="topbar-title" id="learn-title">今日闯关</div>
      <div style="width:40px"></div>
    </header>
    <main class="main-content">
      <div id="learn-progress" class="learn-progress"></div>
      <div id="card-quiz" class="card-quiz"></div>
      <div id="learn-done" class="learn-done hidden">
        <div class="done-icon">🎉</div>
        <h2 id="done-title">今日任务全部完成！</h2>
        <p id="done-msg"></p>
        <div class="done-actions">
          <button class="btn btn-outline" id="btn-back-home-done">返回路径</button>
          <button class="btn btn-primary hidden" id="btn-next-level">继续下一关</button>
        </div>
      </div>
    </main>
  </div>
</template>

<template id="tpl-upload">
  <div class="page">
    <header class="topbar">
      <button class="btn-icon btn-back" id="btn-back-upload">←</button>
      <div class="topbar-title">上传文件</div>
      <div style="width:40px"></div>
    </header>
    <main class="main-content">
      <div class="settings-section">
        <h3>支持的文件类型</h3>
        <p class="form-hint">支持文本、Markdown、C++、头文件、Python、PDF、Word(.docx) 和图片</p>
        <p class="form-hint">PDF 需要是可复制文本的 PDF，不支持扫描图片</p>
        <input type="file" id="upload-file-input" class="upload-input" accept=".txt,.md,.cpp,.h,.py,.pdf,.docx,.png,.jpg,.jpeg,.gif,.webp,.bmp">
        <div id="upload-file-name" class="upload-file-name"></div>
        <button class="btn btn-primary btn-block" id="btn-upload-confirm" disabled>确认上传</button>
      </div>
    </main>
  </div>
</template>

<template id="tpl-ai">
  <div class="page">
    <header class="topbar">
      <button class="btn-icon btn-back" id="btn-back-ai">←</button>
      <div class="topbar-title">AI 趋势分析</div>
      <div style="width:40px"></div>
    </header>
    <main class="main-content">
      <div class="ai-mode-select">
        <label>生成方式</label>
        <div class="ai-mode-control">
          <button class="ai-mode-btn active" data-mode="quick">快速生成</button>
          <button class="ai-mode-btn" data-mode="refine">四阶段精炼</button>
        </div>
      </div>
      <div class="ai-chat" id="ai-chat">
        <div class="ai-msg ai-msg-bot">我会阅读学习区里的文件，把全部知识点按区块整理出来，每一条知识点生成一张卡片。</div>
        <div class="ai-msg ai-msg-user" id="ai-start-hint">点击下方按钮开始分析</div>
      </div>
      <div id="refine-stage" class="refine-stage hidden"></div>
      <div id="ai-result" class="ai-result hidden"></div>
      <div id="refine-options" class="refine-options hidden">
        <div class="refine-option-row">
          <label for="refine-max-items">延伸补充条数上限</label>
          <input type="number" id="refine-max-items" min="1" max="20" value="8">
        </div>
      </div>
      <div id="ai-history-panel" class="ai-history-panel hidden">
        <div class="ai-import-title">AI 分析历史（最近 10 次）</div>
        <div id="ai-history-list" class="ai-select-list"></div>
      </div>
      <div class="ai-file-select">
        <div class="ai-import-title">选择要分析的文件</div>
        <div id="ai-file-list" class="ai-select-list"></div>
      </div>
      <div class="ai-speed-select">
        <label for="ai-speed-select">AI 档位</label>
        <select id="ai-speed-select">
          <option value="auto">自动推荐</option>
          <option value="1">普通</option>
          <option value="5">5倍</option>
          <option value="10">10倍</option>
          <option value="20">20倍</option>
        </select>
        <div id="ai-speed-hint" class="ai-speed-hint"></div>
      </div>
      <div id="ai-import-options" class="ai-import-options hidden">
        <div class="ai-import-title">旧卡片处理</div>
        <div class="ai-import-control">
          <label><input type="radio" name="replace-old" value="none" checked> 保留旧卡片</label>
          <label><input type="radio" name="replace-old" value="all"> 全部删除旧卡片</label>
          <label><input type="radio" name="replace-old" value="selected"> 选择清理旧卡片</label>
        </div>
        <div id="ai-select-cards" class="ai-select-cards hidden">
          <div class="ai-select-head">选择要删除的旧卡片</div>
          <div id="ai-select-list" class="ai-select-list"></div>
        </div>
      </div>
      <div id="ai-analyze-progress" class="ai-progress hidden">
        <div class="ai-progress-bar"><div id="ai-analyze-bar" class="ai-progress-fill"></div></div>
        <span id="ai-analyze-text"></span>
      </div>
      <div id="ai-gen-progress" class="ai-progress hidden">
        <div class="ai-progress-bar"><div id="ai-gen-bar" class="ai-progress-fill"></div></div>
        <span id="ai-gen-text"></span>
      </div>
      <div class="ai-actions">
        <button class="btn btn-primary btn-block" id="btn-ai-analyze">开始分析</button>
        <button class="btn btn-outline btn-block hidden" id="btn-ai-regenerate">重新生成</button>
        <button class="btn btn-success btn-block hidden" id="btn-ai-confirm">确认生成卡片</button>
      </div>
    </main>
  </div>
</template>

<template id="tpl-cards">
  <div class="page">
    <header class="topbar">
      <button class="btn-icon btn-back" id="btn-back-cards">←</button>
      <div class="topbar-title">知识卡片</div>
      <div style="width:40px"></div>
    </header>
    <main class="main-content">
      <div id="library-full" class="library-full"></div>
    </main>
  </div>
</template>

<template id="tpl-wrong">
  <div class="page">
    <header class="topbar">
      <button class="btn-icon btn-back" id="btn-back-zone-wrong">←</button>
      <div class="topbar-title">错题集</div>
      <div style="width:40px"></div>
    </header>
    <main class="main-content">
      <div class="section-header">
        <h3>错题重练</h3>
        <div class="header-actions">
          <button class="btn btn-outline btn-sm" id="btn-wrong-start">单独复习</button>
          <button class="btn btn-primary btn-sm" id="btn-wrong-practice">+ 加入今日练习</button>
        </div>
      </div>
      <div id="wrong-list" class="wrong-list"></div>
      <div id="wrong-empty" class="empty-state hidden">
        <div class="empty-icon">🎯</div>
        <p>还没有错题</p>
        <p class="empty-hint">答错的卡片会自动收进这里</p>
      </div>
    </main>
  </div>
</template>

<template id="tpl-settings">
  <div class="page">
    <main class="settings-grid">
      <div class="card">
        <div class="card-header"><span class="card-title">个人设置</span></div>
        <div class="form-group">
          <label class="form-label">昵称</label>
          <input class="form-input" type="text" id="set-nickname" maxlength="20" placeholder="给自己起个名字">
        </div>
        <div class="form-group">
          <label class="form-label">每日学习卡片数</label>
          <input class="form-input" type="number" id="set-daily-limit" min="1" max="100" value="5">
          <span class="form-hint">每天新学的卡片数量，默认5张</span>
        </div>
        <button class="btn btn-primary" id="btn-save-profile">保存个人设置</button>
      </div>

      <div class="card">
        <div class="card-header"><span class="card-title">本地备份</span></div>
        <p class="form-hint" id="backup-info">数据只保存在本机，导出压缩包后可存网盘或发给他人。</p>
        <div style="display:flex;flex-direction:column;gap:8px;margin-top:12px">
          <button class="btn btn-primary btn-block" id="btn-export-backup">导出完整备份（压缩包）</button>
          <button class="btn btn-outline btn-block" id="btn-import-backup">导入备份文件</button>
          <input type="file" id="import-file-input" accept=".zip" class="hidden">
        </div>
      </div>

      <div class="card">
        <div class="card-header"><span class="card-title">备份目录</span></div>
        <p class="form-hint">设置后导出会优先保存到这里，导入也会优先打开该目录。</p>
        <div id="backup-dir-path" style="padding:10px;background:var(--color-bg-page);border-radius:6px;font-size:13px;margin:8px 0">尚未设置</div>
        <button class="btn btn-outline btn-block" id="btn-choose-backup-dir">选择备份目录</button>
        <button class="btn btn-outline btn-block hidden" id="btn-open-backup-dir">打开备份目录</button>
      </div>

      <div class="card">
        <div class="card-header"><span class="card-title">AI 加速档位</span></div>
        <p class="form-hint">文件达到对应大小后自动切换更高倍速</p>
        <div class="form-group"><label class="form-label">5倍档</label><div class="speed-tier-row"><input class="form-input" type="number" id="speed-tier2-mb" min="0.1" step="0.1" value="1" style="flex:1"><select class="form-select" id="speed-tier2-unit" style="width:84px"><option value="kb">KB</option><option value="mb" selected>MB</option></select></div></div>
        <div class="form-group"><label class="form-label">10倍档</label><div class="speed-tier-row"><input class="form-input" type="number" id="speed-tier3-mb" min="0.2" step="0.1" value="5" style="flex:1"><select class="form-select" id="speed-tier3-unit" style="width:84px"><option value="kb">KB</option><option value="mb" selected>MB</option></select></div></div>
        <div class="form-group"><label class="form-label">20倍档</label><div class="speed-tier-row"><input class="form-input" type="number" id="speed-tier4-mb" min="0.3" step="0.1" value="20" style="flex:1"><select class="form-select" id="speed-tier4-unit" style="width:84px"><option value="kb">KB</option><option value="mb" selected>MB</option></select></div></div>
        <button class="btn btn-outline" id="btn-save-speed-tiers">保存加速档位</button>
      </div>

      <div class="card">
        <div class="card-header">
          <span class="card-title">AI 服务商</span>
          <button class="btn btn-primary btn-sm" id="btn-add-provider">+ 添加</button>
        </div>
        <div id="provider-list" class="provider-list"></div>
        <div id="provider-empty" class="empty-state hidden">
          <div class="empty-icon">🔌</div>
          <p>还没有服务商</p>
          <p class="empty-hint">添加服务商后进入配置页填写接口密钥</p>
        </div>
      </div>

      <div id="settings-msg" class="toast hidden"></div>
      <div class="app-version" id="app-version"></div>
    </main>
  </div>
</template>

<template id=”tpl-provider-detail”>
  <div class=”page”>
    <main class=”settings-grid”>
      <div class=”card”>
        <div class=”card-header”>
          <span class=”card-title” id=”provider-detail-title”>服务商配置</span>
          <span class=”badge” id=”provider-active-badge”>未启动</span>
        </div>
        <div class=”form-group”><label class=”form-label”>服务商名称</label><input class=”form-input” type=”text” id=”p-name” maxlength=”30” placeholder=”例如：我的 DeepSeek”></div>
        <div class=”form-group”><label class=”form-label”>接口地址</label><input class=”form-input” type=”url” id=”p-base-url” placeholder=”https://api.deepseek.com”><span class=”form-hint”>选择服务商模板可自动填入</span></div>
        <div class=”form-group”><label class=”form-label”>接口密钥</label><div style=”display:flex;gap:8px”><input class=”form-input” type=”password” id=”p-api-key” placeholder=”输入你的 API Key” autocomplete=”off” style=”flex:1”><button class=”btn btn-outline btn-sm” id=”btn-toggle-key”>显示</button></div><span class=”form-hint” id=”p-key-hint”></span></div>
        <div class=”form-group”><label class=”form-label”>服务商模板</label><select class=”form-select” id=”p-preset”></select></div>
      </div>

      <div class=”card”>
        <div class=”card-header”><span class=”card-title”>模型</span><button class=”btn btn-outline btn-sm” id=”btn-fetch-models”>获取模型</button></div>
        <div id=”fetch-result” class=”ai-test-result hidden”></div>
        <div style=”display:flex;gap:8px;margin-bottom:8px”><input class=”form-input” type=”number” id=”add-model-count” min=”1” max=”20” value=”1” style=”width:70px”><button class=”btn btn-outline btn-sm” id=”btn-add-model”>+ 添加模型</button></div>
        <div id=”model-rows” class=”model-rows”></div>
        <p id=”model-empty” class=”form-hint”>还没有模型，请先点击”获取模型”，再点”添加模型”。</p>
      </div>

      <div class=”card hidden” id=”custom-template-section”>
        <div class=”card-header”><span class=”card-title”>自定义完整模板</span></div>
        <p class=”form-hint”>支持粘贴各类接口配置软件导出的 JSON 配置</p>
        <textarea class=”form-textarea” id=”template-json” rows=”6” placeholder='{“name”:”我的服务商”,”base_url”:”https://api.example.com/v1”,”api_key”:”sk-...”,”models”:[“model-1”,”model-2”]}'></textarea>
        <div style=”display:flex;gap:8px;margin-top:8px”><button class=”btn btn-outline btn-sm” id=”btn-template-sample” style=”flex:1”>填入示例</button><button class=”btn btn-primary btn-sm” id=”btn-template-apply” style=”flex:1”>应用模板</button></div>
      </div>

      <button class=”btn btn-primary btn-block” id=”btn-save-provider”>保存配置</button>
      <button class=”btn btn-success btn-block” id=”btn-activate-provider”>启动此服务商</button>
      <button class=”btn btn-outline btn-block” id=”btn-test-provider”>测试连接</button>
      <div id=”provider-test-result” class=”ai-test-result hidden”></div>
      <button class=”btn btn-outline btn-block” id=”btn-delete-provider” style=”color:var(--color-danger)”>删除服务商</button>
    </main>
  </div>
</template>

<!-- Toast -->
<div id="toast" class="toast-global hidden"></div>
<!-- Modal -->
<div id="modal" class="modal-overlay hidden">
  <div class="modal-box" id="modal-box"></div>
</div>

<script src="./vendor/jszip.min.js"></script>
